name: tandemlog
description: Offline household tasks with portable canonical logs.
publish_to: none
version: 2026.10.4-rc.1+57
environment:
  sdk: '>=3.9.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  sqlite3: ^3.7.0
  ffi: ^2.2.0
  path_provider: ^2.1.5
  file_selector: ^1.0.4
  crypto: ^3.0.6
  uuid: ^4.5.1
  url_launcher: ^6.3.2
  timezone: 0.11.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_async: ^1.3.3
flutter:
  uses-material-design: true
  assets:
    - native/text_engine/THIRD_PARTY_NOTICES.txt
