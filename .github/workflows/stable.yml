name: Publish accepted stable release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Stable CalVer tag, e.g. v2026.10.0 (no RC suffix)'
        required: true
        type: string
      candidate_run_id:
        description: 'Successful signed stable-version candidate with all platform gates green'
        required: true
        type: string
      android_verified_sha256:
        description: 'Exact stable APK SHA-256 after required native acceptance'
        required: true
        type: string
      lee_accepted:
        description: 'Lee explicitly approved this stable release and its required QA'
        required: true
        default: false
        type: boolean
permissions:
  contents: read
  actions: read
concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false
jobs:
  candidate:
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - id: source
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          LEE_ACCEPTED_STABLE: ${{ inputs.lee_accepted }}
        run: |
          test "$GITHUB_REF" = refs/heads/main
          test "$LEE_ACCEPTED_STABLE" = true
          python3 tool/candidate_source.py
  publish:
    needs: candidate
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.candidate.outputs.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}
          pattern: '{linux,windows,android-release}'
          path: dist
          merge-multiple: true
      - name: Verify exact accepted stable artifacts and publish without rebuilding
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE: ${{ inputs.tag }}
          CANDIDATE_SHA: ${{ needs.candidate.outputs.sha }}
          ANDROID_VERIFIED_SHA256: ${{ inputs.android_verified_sha256 }}
          RELEASE_KIND: stable
          LEE_ACCEPTED_STABLE: ${{ inputs.lee_accepted }}
        run: |
          python3 tool/publish_gate.py
          cd dist
          sha256sum --check linux-SHA256SUMS.txt
          sha256sum --check windows-SHA256SUMS.txt
          sha256sum --check android-SHA256SUMS.txt
          cd ..
          git show "$GITHUB_SHA:design/stable-notes.md" > release-notes.md
          python3 tool/release_assets.py
          gh release create "$CANDIDATE" public-assets/* \
            --target "$CANDIDATE_SHA" --title "$CANDIDATE" --latest=true --notes-file release-notes.md
