name: TEST ONLY Android storage fault harness
on:
  push:
    branches: [evidence/android-storage-fault56]
permissions:
  contents: read
jobs:
  android-storage-fault:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '21'
      - uses: ./.github/actions/setup-flutter
      - uses: ./.github/actions/setup-text-engine
        with:
          platform: android
      - run: flutter pub get --enforce-lockfile
      - name: Build isolated debug overlay of immutable build56 source
        run: >-
          python3 tool/android_storage_fault/build_apk.py
          --revision 76c5dd5cb7eedb09d2d4b62f737d429e1abab7d9
          --output dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: android-storage-fault
          path: dist/*
          retention-days: 5
          if-no-files-found: error
