name: Validate and build
on:
  workflow_call:
    inputs:
      performance_calibration:
        description: Development timing collection only; signed candidates use false
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev xvfb xdotool dbus-x11 flatpak librsvg2-common ${{ github.ref == 'refs/heads/fix/rc4-task-latency-20261022' && 'gdb' || '' }}
      - name: Prepare reviewed AppStream packaging tools
        run: python3 packaging/linux/prepare_appstream_tools.py --destination "$RUNNER_TEMP/reviewed-appstream" --github-path "$GITHUB_PATH"
      - uses: ./.github/actions/setup-flutter
      - uses: ./.github/actions/setup-text-engine
        with:
          platform: linux
      - run: flutter pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed lib test integration_test tool bin
      - run: flutter analyze
      - name: Build and require production native library for all unit tests
        shell: bash
        run: |
          python tool/build_text_engine.py --platform linux --output-dir "$RUNNER_TEMP/native-unit"
          native_library="$RUNNER_TEMP/native-unit/libtandemlog_text.so"
          if [[ "$RUNNER_OS" == Windows ]]; then native_library="$(cygpath -w "$native_library")"; fi
          python tool/native_build_gates.py verify_library "$native_library"
          echo "TANDEMLOG_TEXT_LIBRARY=$native_library" >> "$GITHUB_ENV"
      - run: flutter test
      - name: Verify frozen native admission and worker contracts
        shell: bash
        run: |
          cargo +1.99.0 test --locked --offline --manifest-path native/text_engine/Cargo.toml --target-dir "$TANDEMLOG_TEXT_TARGET_DIR"
          export SPIKE_LIBRARY="$TANDEMLOG_TEXT_LIBRARY"
          python -m unittest discover -s experiments/yrs-spike/tests -v
      - run: python3 -m unittest discover -s tool -p 'test_*.py'
      - run: flutter build linux --release
      - run: python tool/native_build_gates.py verify_payload --platform linux --payload build/linux/x64/release/bundle
      - name: Build and smoke the headless agent CLI with the app's text library
        run: env -u DISPLAY -u WAYLAND_DISPLAY python3 tool/build_agent_cli.py --platform linux --text-library build/linux/x64/release/bundle/lib/libtandemlog_text.so --output build/agent-cli
      - name: Smoke-test native release startup with fresh and warm cache
        id: linux-startup
        timeout-minutes: 8
        run: |
          mkdir -p linux-startup-diagnostics
          if [[ "$GITHUB_REF" == refs/heads/fix/rc4-task-latency-20261022 ]]; then
            mkdir "$RUNNER_TEMP/rc4-startup-cores"
            original_pattern="$(cat /proc/sys/kernel/core_pattern)"
            trap 'printf "%s\n" "$original_pattern" | sudo tee /proc/sys/kernel/core_pattern > /dev/null' EXIT
            trap 'exit 130' INT
            trap 'exit 143' TERM
            printf '%s\n' "$RUNNER_TEMP/rc4-startup-cores/core.%p" | sudo tee /proc/sys/kernel/core_pattern > /dev/null
            ulimit -c 524288
          fi
          set +e
          xvfb-run -a dbus-run-session -- python3 tool/measure_startup.py --tasks 10 --runs 2 --workspace "$RUNNER_TEMP/tandemlog-performance" --diagnostics linux-startup-diagnostics > linux-startup.json 2> linux-startup-diagnostics/harness.stderr.log
          original_status=$?
          set -e
          if [[ "$GITHUB_REF" == refs/heads/fix/rc4-task-latency-20261022 ]]; then
            set +e
            python3 tool/collect_linux_core_stacks.py --source "$GITHUB_WORKSPACE" --cores "$RUNNER_TEMP/rc4-startup-cores" --output linux-startup-diagnostics/postmortem
            collector_status=$?
            set -e
            if [[ "$original_status" == 0 ]]; then exit "$collector_status"; fi
          fi
          exit "$original_status"
      - name: Preserve RC4 postmortem and exact test-only bundle
        if: always() && github.ref == 'refs/heads/fix/rc4-task-latency-20261022' && steps.linux-startup.outcome != 'skipped'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: RC4-required-ci-linux-close
          path: |
            linux-startup.json
            linux-startup-diagnostics/**/*.json
            linux-startup-diagnostics/**/*.txt
            linux-startup-diagnostics/**/*.log
            build/linux/x64/release/bundle/**
          retention-days: 5
          if-no-files-found: warn
      - name: Preserve failed startup diagnostics
        if: failure() && steps.linux-startup.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: linux-startup-diagnostics
          path: |
            linux-startup.json
            linux-startup-diagnostics/*
          retention-days: 5
          if-no-files-found: warn
      - name: Require normal-exit GTK and Flutter disposal
        id: linux-disposal
        timeout-minutes: 3
        run: xvfb-run -a dbus-run-session -- python3 tool/verify_linux_disposal.py --output linux-disposal-diagnostics
      - name: Preserve native disposal evidence
        if: always() && steps.linux-disposal.outcome != 'skipped'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: linux-disposal
          path: |
            linux-disposal-diagnostics/*.json
            linux-disposal-diagnostics/*.log
            linux-disposal-diagnostics/*.so
          retention-days: 5
          if-no-files-found: error
      - run: |
          mkdir dist
          cp linux-startup.json dist/
      - name: Build user-installable Flatpak bundle
        run: bash packaging/linux/build-flatpak.sh
      - name: Install, launch, replace and uninstall Flatpak with synthetic data
        id: linux-install-smoke
        run: xvfb-run -a dbus-run-session -- bash packaging/linux/install-smoke.sh
      - name: Preserve failed installed application diagnostics
        if: failure() && steps.linux-install-smoke.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: linux-install-smoke-diagnostics
          path: |
            ${{ runner.temp }}/tandemlog-flatpak-qa/*.log
            ${{ runner.temp }}/tandemlog-flatpak-qa/installer-diagnostics/*
          retention-days: 5
          if-no-files-found: warn
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux
          path: dist/*
          retention-days: 5
          if-no-files-found: error
  # The native workflow suite was the Linux long pole. package:test runs
  # contiguous, disjoint slices of the one suite; the union job requires that
  # the shard reports together cover every declared case exactly once.
  linux-workflows:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev xvfb xdotool dbus-x11 flatpak librsvg2-common
      - uses: ./.github/actions/setup-flutter
      - uses: ./.github/actions/setup-text-engine
        with:
          platform: linux
      - run: flutter pub get --enforce-lockfile
      - name: Build and require production native library for native workflows
        run: |
          python3 tool/build_text_engine.py --platform linux --output-dir "$RUNNER_TEMP/native-workflows"
          python3 tool/native_build_gates.py verify_library "$RUNNER_TEMP/native-workflows/libtandemlog_text.so"
          echo "TANDEMLOG_TEXT_LIBRARY=$RUNNER_TEMP/native-workflows/libtandemlog_text.so" >> "$GITHUB_ENV"
      - name: Run bounded native Linux workflows
        timeout-minutes: 30
        env:
          SHARD: ${{ matrix.shard }}
        run: >-
          xvfb-run -a dbus-run-session --
          flutter test integration_test/task_flow_test.dart -d linux --reporter expanded --timeout 120s
          --total-shards 4 --shard-index "$SHARD"
          --file-reporter "json:$RUNNER_TEMP/native-workflows-$SHARD.json"
      - name: Preserve shard report for the union gate
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: linux-workflows-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/native-workflows-${{ matrix.shard }}.json
          retention-days: 5
          if-no-files-found: warn
  linux-workflows-union:
    needs: linux-workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: linux-workflows-shard-*
          path: ${{ runner.temp }}/native-workflows
          merge-multiple: true
      - name: Require every native workflow case exactly once across shards
        run: >-
          python3 tool/verify_test_shards.py --suite integration_test/task_flow_test.dart
          "$RUNNER_TEMP"/native-workflows/native-workflows-{0,1,2,3}.json
  windows:
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./.github/actions/setup-flutter
      - uses: ./.github/actions/setup-text-engine
        with:
          platform: windows
      - run: flutter pub get --enforce-lockfile
      - name: Build and require production native library for all unit tests
        shell: bash
        run: |
          python tool/build_text_engine.py --platform windows --output-dir "$RUNNER_TEMP/native-unit"
          native_library="$RUNNER_TEMP/native-unit/tandemlog_text.dll"
          if [[ "$RUNNER_OS" == Windows ]]; then native_library="$(cygpath -w "$native_library")"; fi
          python tool/native_build_gates.py verify_library "$native_library"
          echo "TANDEMLOG_TEXT_LIBRARY=$native_library" >> "$GITHUB_ENV"
      - name: Run Windows unit tests with retained diagnostics
        id: windows-unit
        run: flutter test --reporter expanded --file-reporter json:windows-unit-tests.json
      - name: Preserve Windows unit-test results
        if: always() && steps.windows-unit.outcome != 'skipped'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: windows-unit-tests
          path: windows-unit-tests.json
          retention-days: 5
          if-no-files-found: warn
      - name: Verify frozen native admission and worker contracts
        shell: bash
        run: |
          cargo +1.99.0 test --locked --offline --manifest-path native/text_engine/Cargo.toml --target-dir "$TANDEMLOG_TEXT_TARGET_DIR"
          export SPIKE_LIBRARY="$TANDEMLOG_TEXT_LIBRARY"
          python -m unittest discover -s experiments/yrs-spike/tests -v
      - run: python -m unittest discover -s tool -p 'test_*.py'
      - run: python tool/app_version.py
      - run: flutter build windows --release
      - run: python tool/native_build_gates.py verify_payload --platform windows --payload build/windows/x64/runner/Release
      - name: Compile exact-source synthetic profile process harness
        shell: pwsh
        run: |
          dart build cli --target test/support/local_profile_database_child.dart --output build/storage-harness
          if ($LASTEXITCODE -ne 0) { throw 'Native profile harness compilation failed' }
          python tool/package_storage_harness.py --bundle build/storage-harness/bundle --app-bundle build/windows/x64/runner/Release --output storage-harness-dist --source "$env:GITHUB_SHA" --run "$env:GITHUB_RUN_ID"
          if ($LASTEXITCODE -ne 0) { throw 'Native profile harness provenance failed' }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: windows-storage-harness
          path: storage-harness-dist/*
          retention-days: 5
          if-no-files-found: error
      # After the storage harness, which requires one SQLite DLL in the app
      # payload; the CLI's own lib/ then joins the bundle that the portable
      # ZIP and installer package unchanged.
      - name: Build and smoke the agent CLI inside the Release bundle
        shell: pwsh
        run: |
          python tool/build_agent_cli.py --platform windows --text-library build/windows/x64/runner/Release/tandemlog_text.dll --output build/windows/x64/runner/Release/cli
          if ($LASTEXITCODE -ne 0) { throw 'Agent CLI build or smoke failed' }
      - name: Preserve exact portable Windows payload for isolated native acceptance
        shell: pwsh
        run: >-
          python packaging/windows/package_portable.py
          --bundle build/windows/x64/runner/Release
          --output dist
          --source-revision "$env:GITHUB_SHA"
          --run-id "$env:GITHUB_RUN_ID"
      - name: Build per-user installer and verify native installation lifecycle
        shell: pwsh
        run: |
          ./packaging/windows/build-and-smoke.ps1
          Get-Content dist/windows-SHA256SUMS.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: windows
          path: dist/*
          retention-days: 5
          if-no-files-found: error
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: ./.github/actions/setup-flutter
      - uses: ./.github/actions/setup-text-engine
        with:
          platform: android
      - name: Install reviewed Gradle repository policy before resolution
        shell: bash
        run: |
          echo "GRADLE_USER_HOME=$RUNNER_TEMP/tandemlog-gradle" >> "$GITHUB_ENV"
          GRADLE_USER_HOME="$RUNNER_TEMP/tandemlog-gradle" python3 tool/gradle_repository_policy.py install
      - run: flutter pub get --enforce-lockfile
      # The standard Ubuntu runner image includes this exact build-tools version.
      - run: test -x "$ANDROID_HOME/build-tools/36.0.0/apksigner"
      - name: Observe reviewed Kotlin scopes on the remediation branch
        if: github.ref == 'refs/heads/fix/kotlin-2.4.20-remediation'
        shell: bash
        run: |
          observation_dir="$RUNNER_TEMP/kotlin-remediation"
          mkdir -p "$observation_dir" "${GRADLE_USER_HOME:-$HOME/.gradle}/init.d"
          cp evidence/kotlin-remediation/ci/observe.gradle "${GRADLE_USER_HOME:-$HOME/.gradle}/init.d/kotlin-remediation.gradle"
          echo "KOTLIN_REMEDIATION_EVIDENCE_DIR=$observation_dir" >> "$GITHUB_ENV"
          echo "KOTLIN_REMEDIATION_PHASE=cold" >> "$GITHUB_ENV"
          echo "KOTLIN_REMEDIATION_MANIFEST=$GITHUB_WORKSPACE/evidence/kotlin-remediation/graph.json" >> "$GITHUB_ENV"
      - name: Build Android debug APK
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/heads/fix/kotlin-2.4.20-remediation ]]; then
            set -o pipefail
            flutter build apk --debug 2>&1 | tee "$KOTLIN_REMEDIATION_EVIDENCE_DIR/cold-build.txt"
            python tool/native_build_gates.py verify_payload --platform android --payload build/app/outputs/flutter-apk/app-debug.apk 2>&1 | tee "$KOTLIN_REMEDIATION_EVIDENCE_DIR/cold-native-gate.txt"
            sha256sum build/app/outputs/flutter-apk/app-debug.apk > "$KOTLIN_REMEDIATION_EVIDENCE_DIR/cold-apk.sha256"
          else
            flutter build apk --debug
          fi
      - name: Repeat warm Android debug build on the remediation branch
        if: github.ref == 'refs/heads/fix/kotlin-2.4.20-remediation'
        shell: bash
        run: |
          set -o pipefail
          export KOTLIN_REMEDIATION_PHASE=warm
          flutter build apk --debug 2>&1 | tee "$KOTLIN_REMEDIATION_EVIDENCE_DIR/warm-build.txt"
          python tool/native_build_gates.py verify_payload --platform android --payload build/app/outputs/flutter-apk/app-debug.apk 2>&1 | tee "$KOTLIN_REMEDIATION_EVIDENCE_DIR/warm-native-gate.txt"
          sha256sum build/app/outputs/flutter-apk/app-debug.apk > "$KOTLIN_REMEDIATION_EVIDENCE_DIR/warm-apk.sha256"
      - if: github.ref != 'refs/heads/fix/kotlin-2.4.20-remediation'
        run: python tool/native_build_gates.py verify_payload --platform android --payload build/app/outputs/flutter-apk/app-debug.apk
      - run: |
          mkdir dist
          cp build/app/outputs/flutter-apk/app-debug.apk dist/tandemlog-android-test-only.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs dist/tandemlog-android-test-only.apk > dist/android-signature.txt
          cd dist
          sha256sum tandemlog-android-test-only.apk > android-SHA256SUMS.txt
          cat android-SHA256SUMS.txt
          cat android-signature.txt
      - name: Preserve cold and warm Kotlin evaluation receipts
        if: github.ref == 'refs/heads/fix/kotlin-2.4.20-remediation' && always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: kotlin-remediation-android-evidence
          path: ${{ runner.temp }}/kotlin-remediation/*
          retention-days: 5
          if-no-files-found: error
      - name: Remove the remediation observation script
        if: github.ref == 'refs/heads/fix/kotlin-2.4.20-remediation' && always()
        shell: bash
        run: rm -f "${GRADLE_USER_HOME:-$HOME/.gradle}/init.d/kotlin-remediation.gradle"
      - name: Package separate recovery harness on the isolated adoption branch
        if: github.ref == 'refs/heads/experiment/text-activation-policy'
        run: |
          # This immutable reviewed base excludes unrelated in-flight experiments.
          git fetch --no-tags --depth=1 origin 926f28dd617527d168ce94236bb9f4a99d1f9708
          python3 tool/android_recovery/build_apk.py \
            --revision 926f28dd617527d168ce94236bb9f4a99d1f9708 \
            --output "$GITHUB_WORKSPACE/dist/android-recovery"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs \
            dist/android-recovery/tandemlog-TEST-ONLY-recovery-debug.apk \
            > dist/android-recovery/signature.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: android
          path: dist/*
          retention-days: 5
          if-no-files-found: error

  performance:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./.github/actions/setup-flutter
      - uses: ./.github/actions/setup-text-engine
        with:
          platform: linux
      - run: flutter pub get --enforce-lockfile
      - name: Build reviewed native text library
        run: |
          python3 tool/build_text_engine.py --platform linux --output-dir "$RUNNER_TEMP/performance-native"
          python3 tool/native_build_gates.py verify_library "$RUNNER_TEMP/performance-native/libtandemlog_text.so"
          echo "TANDEMLOG_TEXT_LIBRARY=$RUNNER_TEMP/performance-native/libtandemlog_text.so" >> "$GITHUB_ENV"
      - name: Verify SQLite profile adapter and materialize locked native assets
        run: flutter test --no-pub test/local_profile_database_test.dart
      - name: Require hosted AOT correctness and retain advisory timings
        timeout-minutes: 56
        shell: bash
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/performance-diagnostics"
          # Hosted correctness/bindings remain mandatory. The same absolute and
          # growth limits qualify separately on the controlled reference host.
          limits_sha="e118730325d00468f0218b70c0bbae939a68e363fd960bef68e743196f0672d8"
          mode=(--hosted-advisory)
          if [[ "${{ inputs.performance_calibration }}" == true ]]; then
            mode=(--measure-only)
          fi
          bash tool/performance/run_ci.sh "$limits_sha" "${mode[@]}" \
            > "$RUNNER_TEMP/performance-diagnostics/runner.stdout.log" \
            2> "$RUNNER_TEMP/performance-diagnostics/runner.stderr.log"
      - name: Retain every performance attempt and preflight diagnostic
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-performance
          path: |
            ${{ runner.temp }}/performance-diagnostics/*.log
            ${{ runner.temp }}/performance-results/gate-result.json
            ${{ runner.temp }}/performance-results/*-result.json
            ${{ runner.temp }}/performance-results/*.log
            ${{ runner.temp }}/performance-results/fixture-*/fixture.json
          retention-days: 5
          if-no-files-found: warn

  reference-performance:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Require fresh source-bound controlled-reference qualification
        run: python3 tool/performance/reference_receipt.py verify --repo "$GITHUB_WORKSPACE"
