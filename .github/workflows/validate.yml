name: Exact build56 Windows visible-window proof
on:
  push:
    branches: [evidence/windows-visible-build56]
permissions:
  contents: read
  actions: read
jobs:
  exact-windows-visible:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Install existing exact build56 and require visible native window
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          py -3.11 tool/windows_visible56.py
          if ($LASTEXITCODE -ne 0) { throw 'Exact installed visible-window proof failed' }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: windows-build56-visible-proof
          path: visible-proof-dist/*
          retention-days: 5
          if-no-files-found: error
