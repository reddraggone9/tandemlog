name: RC4 diagnostic-only Linux normal close
on:
  workflow_dispatch:
  push:
    branches: [fix/rc4-task-latency-20261022]
    paths:
      - '.github/workflows/rc4-linux-close-diagnostic.yml'
      - 'tool/diagnose_linux_close.py'
      - 'tool/test_diagnose_linux_close.py'
      - 'tool/collect_linux_core_stacks.py'
      - 'tool/test_collect_linux_core_stacks.py'
permissions:
  contents: read
concurrency:
  group: rc4-linux-close-diagnostic-${{ github.ref }}
  cancel-in-progress: false
jobs:
  diagnostic-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Require isolated RC4 development source
        run: test "$GITHUB_REF" = refs/heads/fix/rc4-task-latency-20261022
      - name: Prepare native debugger and owned virtual display
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev xvfb xdotool dbus-x11 flatpak librsvg2-common gdb
      - uses: ./.github/actions/setup-flutter
      - uses: ./.github/actions/setup-text-engine
        with:
          platform: linux
      - run: flutter pub get --enforce-lockfile
      - name: Check diagnostic ownership and crash classification controls
        run: |
          python3 -m unittest discover -s tool -p test_diagnose_linux_close.py
          python3 -m unittest discover -s tool -p test_collect_linux_core_stacks.py
      - name: Restore exact original failing source and native-library environment
        run: |
          cp tool/collect_linux_core_stacks.py "$RUNNER_TEMP/rc4-core-collector.py"
          git checkout --detach cb1ea0e1317cd4550ced8349894076652d4e0cfd
          test "$(git rev-parse HEAD)" = cb1ea0e1317cd4550ced8349894076652d4e0cfd
          git diff --exit-code
          python3 tool/build_text_engine.py --platform linux --output-dir "$RUNNER_TEMP/native-unit"
          python3 tool/native_build_gates.py verify_library "$RUNNER_TEMP/native-unit/libtandemlog_text.so"
          echo "TANDEMLOG_TEXT_LIBRARY=$RUNNER_TEMP/native-unit/libtandemlog_text.so" >> "$GITHUB_ENV"
      - name: Build ordinary release application without source modifications
        run: |
          flutter build linux --release --no-pub
          python3 tool/native_build_gates.py verify_payload --platform linux --payload build/linux/x64/release/bundle
      - name: Run original startup harness with post-fault core capture
        timeout-minutes: 8
        shell: bash
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/rc4-original-close" "$RUNNER_TEMP/rc4-original-cores"
          original_pattern="$(cat /proc/sys/kernel/core_pattern)"
          trap 'printf "%s\n" "$original_pattern" | sudo tee /proc/sys/kernel/core_pattern > /dev/null' EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM
          printf '%s\n' "$RUNNER_TEMP/rc4-original-cores/core.%p" | sudo tee /proc/sys/kernel/core_pattern > /dev/null
          ulimit -c 524288
          set +e
          xvfb-run -a dbus-run-session -- python3 tool/measure_startup.py --tasks 10 --runs 2 --workspace "$RUNNER_TEMP/tandemlog-performance" --diagnostics "$RUNNER_TEMP/rc4-original-close" > "$RUNNER_TEMP/rc4-original-close/harness.stdout.log" 2> "$RUNNER_TEMP/rc4-original-close/harness.stderr.log"
          original_status=$?
          set -e
          python3 "$RUNNER_TEMP/rc4-core-collector.py" --source "$GITHUB_WORKSPACE" --cores "$RUNNER_TEMP/rc4-original-cores" --output "$RUNNER_TEMP/rc4-original-close/postmortem"
          exit "$original_status"
      - name: Preserve every diagnostic and exact test-only bundle
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: RC4-diagnostic-only-linux-close
          path: |
            ${{ runner.temp }}/rc4-original-close/**/*.json
            ${{ runner.temp }}/rc4-original-close/**/*.log
            ${{ runner.temp }}/rc4-original-close/**/*.txt
            build/linux/x64/release/bundle/**
          retention-days: 5
          if-no-files-found: error
