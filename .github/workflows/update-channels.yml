name: Advance stable update channels
# Manual and off by default: nothing runs without an approved signing identity in
# repository variables. Prereleases cannot pass; see tool/flatpak_channel.py.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Stable tag that is GitHub Latest, e.g. v2026.11.0'
        required: true
        type: string
      candidate_run_id:
        description: 'The candidate run whose linux-flatpak-repo became that release'
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: update-channels
  cancel-in-progress: false
jobs:
  site:
    if: vars.TANDEMLOG_FLATPAK_CHANNEL == 'enabled' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: sudo apt-get update && sudo apt-get install -y ostree
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}
          name: linux-flatpak-repo
          path: channel
      - name: Lay out the exact accepted repository
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          FINGERPRINT: ${{ vars.TANDEMLOG_FLATPAK_FINGERPRINT }}
          PUBLIC_KEY: ${{ vars.TANDEMLOG_FLATPAK_PUBLIC_KEY }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" > release.json
          gh api "repos/$GITHUB_REPOSITORY/releases/latest" > latest.json
          printf '%s' "$PUBLIC_KEY" | base64 -d > public.gpg
          python3 tool/flatpak_channel.py site \
            --archive channel/flatpak-repo.tar \
            --provenance channel/flatpak-repo-provenance.json \
            --release release.json --latest latest.json \
            --public-key public.gpg --fingerprint "$FINGERPRINT" --output site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: site
  deploy:
    needs: site
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
