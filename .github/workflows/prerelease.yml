name: Experimental prerelease
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Candidate tag, e.g. v0.1.0-rc.2'
        required: true
        type: string
      candidate_run_id:
        description: 'Successful Build signed candidate run with all platform gates green'
        required: true
        type: string
      android_verified_sha256:
        description: 'SHA-256 of that exact APK after native installation/launch and required QA passed'
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: prerelease-${{ inputs.tag }}
  cancel-in-progress: false
jobs:
  candidate:
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - id: source
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
        run: |
          test "$GITHUB_REF" = refs/heads/main
          python3 tool/candidate_source.py
  publish:
    needs: candidate
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.candidate.outputs.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}
          pattern: '{linux,windows,android-release}'
          path: dist
          merge-multiple: true
      - name: Verify accepted APK and installed desktop gates; publish experimental preview
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE: ${{ inputs.tag }}
          CANDIDATE_SHA: ${{ needs.candidate.outputs.sha }}
          ANDROID_VERIFIED_SHA256: ${{ inputs.android_verified_sha256 }}
        run: |
          python3 tool/publish_gate.py
          cd dist
          sha256sum --check linux-SHA256SUMS.txt
          sha256sum --check windows-SHA256SUMS.txt
          sha256sum --check android-SHA256SUMS.txt
          cd ..
          # Artifact/source gates remain pinned to the accepted candidate.
          # Copy may be corrected in a later approved docs-only main commit;
          # pin it to this dispatch commit, not a moving branch at publish time.
          git show "$GITHUB_SHA:design/prerelease-notes.md" > release-notes.md
          # Evidence/checksums stay in the gated candidate; users see installers.
          python3 tool/release_assets.py
          gh release create "$CANDIDATE" public-assets/* \
            --target "$CANDIDATE_SHA" --title "$CANDIDATE — experimental" --prerelease --latest=false --notes-file release-notes.md
