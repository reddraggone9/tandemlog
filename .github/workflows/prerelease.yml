name: Isolated dependency smoke (no publication)
on:
  push:
    branches: [audit/dependency-smoke-20261011]
  workflow_dispatch:
    inputs:
      source_run_id:
        description: 'Earlier successful smoke producer run; blank seeds a fixture'
        required: false
        default: ''
        type: string
# Existing read-only scopes. No write scopes, signing, release jobs, secrets,
# or candidate concurrency group exist in this temporary branch workflow.
permissions:
  contents: read
  actions: read
concurrency:
  group: dependency-smoke-${{ github.ref }}
  cancel-in-progress: false
jobs:
  artifact:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: python3 tool/dependency_smoke.py seed "$RUNNER_TEMP/seed"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: dependency-smoke
          path: ${{ runner.temp }}/seed/*
          retention-days: 2
          if-no-files-found: error
      - name: Require a different source run
        if: inputs.source_run_id != ''
        env:
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: test "$SOURCE_RUN_ID" != "$GITHUB_RUN_ID"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        if: inputs.source_run_id != ''
        with:
          name: dependency-smoke
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/received
          digest-mismatch: error
      - name: Require exact filenames, bytes and checksums
        if: inputs.source_run_id != ''
        run: python3 tool/dependency_smoke.py verify "$RUNNER_TEMP/received"
  native-folder:
    if: inputs.source_run_id == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev xvfb dbus-x11
      - uses: ./.github/actions/setup-flutter
      - uses: ./.github/actions/setup-text-engine
        with:
          platform: linux
      - run: flutter pub get --enforce-lockfile
      - run: flutter test test/folder_actions_test.dart
      - run: dart format --output=none --set-exit-if-changed integration_test/folder_actions_smoke_test.dart
      - run: python3 tool/dependency_smoke.py desktop "$RUNNER_TEMP/folder-smoke"
      - name: Real native Linux folder opening with spaces and Unicode
        run: |
          export TANDEMLOG_FOLDER_SMOKE_ROOT="$RUNNER_TEMP/folder-smoke"
          export XDG_CONFIG_HOME="$TANDEMLOG_FOLDER_SMOKE_ROOT/config"
          export XDG_DATA_HOME="$TANDEMLOG_FOLDER_SMOKE_ROOT/data"
          xvfb-run -a dbus-run-session -- flutter test integration_test/folder_actions_smoke_test.dart -d linux
      - name: Real native Linux missing file-manager failure
        run: |
          export TANDEMLOG_FOLDER_SMOKE_ROOT="$RUNNER_TEMP/folder-smoke"
          export TANDEMLOG_FOLDER_SMOKE_MISSING=1
          export XDG_CONFIG_HOME="$TANDEMLOG_FOLDER_SMOKE_ROOT/missing/config"
          export XDG_DATA_HOME="$TANDEMLOG_FOLDER_SMOKE_ROOT/missing/data"
          export XDG_DATA_DIRS="$TANDEMLOG_FOLDER_SMOKE_ROOT/missing/system"
          xvfb-run -a dbus-run-session -- flutter test integration_test/folder_actions_smoke_test.dart -d linux
