name: Experimental prerelease
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Candidate tag, e.g. v0.1.0-rc.1'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: prerelease-${{ inputs.tag }}
  cancel-in-progress: false
jobs:
  candidate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - env:
          CANDIDATE: ${{ inputs.tag }}
        run: |
          test "$GITHUB_REF" = refs/heads/main
          [[ "$CANDIDATE" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-(alpha|beta|rc)\.[0-9]+$ ]]
          VERSION=$(sed -n 's/^version: \([^+]*\).*/\1/p' pubspec.yaml)
          test "$CANDIDATE" = "v$VERSION"
          if git ls-remote --exit-code --tags origin "refs/tags/$CANDIDATE"; then
            echo "Candidate tag already exists; choose a new version" >&2
            exit 1
          else
            test "$?" = 2
          fi
  checks:
    needs: candidate
    uses: ./.github/workflows/validate.yml
  publish:
    needs: checks
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE: ${{ inputs.tag }}
        run: |
          cd dist
          sha256sum --check linux-SHA256SUMS.txt
          sha256sum --check windows-SHA256SUMS.txt
          sha256sum --check android-SHA256SUMS.txt
          cd ..
          python3 -c 'from pathlib import Path; assert all(p.stat().st_size < 2*1024**3 for p in Path("dist").iterdir())'
          cp design/prerelease-notes.md release-notes.md
          printf '\nSource commit: `%s`\n' "$GITHUB_SHA" >> release-notes.md
          # Recheck immediately before creating the release; never reuse a tag.
          if git ls-remote --exit-code --tags origin "refs/tags/$CANDIDATE"; then
            exit 1
          else
            test "$?" = 2
          fi
          gh release create "$CANDIDATE" dist/* --target "$GITHUB_SHA" --title "$CANDIDATE — experimental" --prerelease --latest=false --notes-file release-notes.md
