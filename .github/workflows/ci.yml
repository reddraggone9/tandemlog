name: CI
on:
  push:
    branches: [main]
    # Documentation/evidence-only pushes do not change executable behavior.
    # PRs, manual runs and every release candidate still retain full checks.
    paths-ignore:
      - "**/*.md"
      - "evidence/**"
      - "experiments/yrs-spike/evidence/**"
  pull_request:
  workflow_dispatch:
    inputs:
      calibrate_performance:
        description: Collect synthetic timings only; does not satisfy a release performance gate
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    uses: ./.github/workflows/validate.yml
    with:
      performance_calibration: ${{ github.event_name == 'workflow_dispatch' && inputs.calibrate_performance }}
