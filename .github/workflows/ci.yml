name: CI
on:
  push:
    branches: [main]
    # Documentation/evidence-only pushes do not change executable behavior.
    # PRs, manual runs and every release candidate still retain full checks.
    paths-ignore:
      - "**/*.md"
      - "evidence/**"
      - "experiments/yrs-spike/evidence/**"
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    uses: ./.github/workflows/validate.yml
